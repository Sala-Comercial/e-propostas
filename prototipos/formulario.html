<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criador de propostas · Formulário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   SASI UI · v1.0
   Sistema visual dos dashboards SASI — extraído do Dashboard Comercial v2.
   -------------------------------------------------------------------
   Conceito: superfícies claras, linhas finas, sem sombras pesadas.
   Cores tiradas da própria marca: navy #0d2149 e o verde #00a651 do
   ponto do logo. O verde é ACENTO — usado com parcimônia (destaques
   positivos, metas batidas, tags), nunca como cor dominante.
   Fonte: Inter (Google Fonts), pesos 400/450/500/600/700.

   Como usar:
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="css/sasi-ui.css">
   Estrutura mínima da página:
     <div class="app">
       <aside class="side">…</aside>
       <div class="main">
         <header class="top">…</header>
         <div class="wrap">…conteúdo…</div>
       </div>
     </div>
═══════════════════════════════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* marca */
  --navy:#0d2149;        /* cor principal — texto forte, barras, botões */
  --navy-2:#1b3566;      /* navy mais claro para gradações */
  --green:#00a651;       /* acento — só destaques positivos */
  --green-soft:#e8f7ef;  /* fundo de tags/medalhas verdes */
  /* texto */
  --ink:#0f172a;         /* texto principal */
  --ink-2:#475569;       /* texto secundário */
  --ink-3:#94a3b8;       /* texto de apoio, legendas */
  /* superfícies e linhas */
  --line:#e9edf3;        /* bordas de cards e divisórias fortes */
  --line-2:#f2f5f9;      /* divisórias suaves e trilhos de barras */
  --bg:#f7f8fa;          /* fundo da página */
  --surface:#ffffff;     /* fundo de cards, sidebar, topbar */
  /* estados */
  --red:#e11d48;         /* alerta, negativo */
  --amber:#d97706;       /* atenção */
  --blue:#2563eb;        /* informativo (ex.: temperatura "frio") */
  /* geometria */
  --r:14px;              /* raio padrão de cards */
}

html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ═══ SHELL: sidebar + topbar + conteúdo ═══ */
.app{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:20;transition:width .2s ease}
/* Lockup da marca: símbolo + divisória vertical + nome do produto ao lado. */
.side-brand{display:flex;align-items:center;gap:12px;padding:20px 20px 18px;border-bottom:1px solid var(--line)}
.side-brand img{width:84px;height:auto;display:block;flex-shrink:0}
.side-brand .bd{width:1px;height:28px;background:var(--line);flex-shrink:0}
.side-brand .pname{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.25;letter-spacing:-.1px}
.side-group{padding:6px 12px}
.side-group .gl{font-size:10px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;
  color:var(--ink-3);padding:12px 10px 7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;
  font-size:13.5px;font-weight:450;color:var(--ink-2);user-select:none;transition:background .13s,color .13s}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.75}
.nav-item:hover{background:var(--line-2);color:var(--ink)}
.nav-item.on{background:var(--navy);color:#fff;font-weight:500}
.nav-item.on svg{opacity:1}
.side-foot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);line-height:1.7}

.main{flex:1;margin-left:236px;display:flex;flex-direction:column;min-width:0;transition:margin-left .2s ease}

/* sidebar recolhida (adicione .collapsed ao .app) */
.app.collapsed .side{width:64px}
.app.collapsed .side-brand{justify-content:center;gap:0;padding:18px 8px}
.app.collapsed .side-brand img{width:38px}
.app.collapsed .side-brand .bd,.app.collapsed .side-brand .pname,
.app.collapsed .nav-item span,.app.collapsed .side-group .gl,.app.collapsed .side-foot{display:none}
.app.collapsed .nav-item{justify-content:center;padding:11px}
.app.collapsed .side-group{padding:10px 10px}
.app.collapsed .main{margin-left:64px}

/* topbar */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:0 30px;height:62px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:15}
.top h1{font-size:16px;font-weight:600;letter-spacing:-.2px}
.top .crumb{font-size:11px;color:var(--ink-3);margin-bottom:1px}
.top-left{display:flex;align-items:center;gap:14px;min-width:0}
.top-right{display:flex;align-items:center;gap:10px}
.wrap{padding:26px 30px 40px;flex:1}

/* ═══ CONTROLES ═══ */
.icon-btn{width:32px;height:32px;flex-shrink:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .13s,border-color .13s,color .13s}
.icon-btn:hover{background:var(--line-2);color:var(--ink);border-color:#dbe1ea}
.icon-btn:active{transform:translateY(1px)}
.icon-btn svg{width:16px;height:16px}

.sel{font:inherit;font-size:12.5px;font-weight:450;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
.sel:hover{border-color:#dbe1ea}
.sel:focus{outline:none;border-color:var(--navy)}

/* variante compacta (dentro de cabeçalhos de card) */
.pipe-sel{font:inherit;font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
.pipe-sel:focus{outline:none;border-color:var(--navy)}

.busca{font:inherit;font-size:12px;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;width:190px}
.busca:focus{outline:none;border-color:var(--navy)}
.busca::placeholder{color:var(--ink-3)}

/* botões-pílula de seleção (ex.: quinzenas) */
.qz{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qz-b{font:inherit;font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer}
.qz-b:hover{border-color:#dbe1ea}
.qz-b.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* indicador de sincronização com botão de atualizar */
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:9px;padding:6px 7px 6px 11px}
.sync button{width:26px;height:26px;border:none;border-radius:7px;background:var(--navy);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.sync button svg{width:13px;height:13px}
.sync button.spin svg{animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ═══ BLOCOS ═══ */
/* Faixa de KPIs: células brancas separadas por linhas de 1px (o gap mostra
   o fundo --line), tudo dentro de uma borda arredondada única. */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.stat{background:var(--surface);padding:18px 20px}
.stat .l{font-size:11.5px;color:var(--ink-3);font-weight:500}
.stat .v{font-size:27px;font-weight:600;letter-spacing:-.7px;margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
.stat .d{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.stat .d b{color:var(--green);font-weight:600}
.stat.click{cursor:pointer;transition:background .13s}
.stat.click:hover{background:#fcfdfe}

/* grades de painéis */
.grid{display:grid;gap:18px;margin-bottom:18px}
.g-2{grid-template-columns:1fr 1fr}
.g-21{grid-template-columns:1.65fr 1fr}

/* card padrão */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel-h{padding:16px 20px 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-h h2{font-size:13.5px;font-weight:600;letter-spacing:-.1px}
.panel-h .hint{font-size:11.5px;color:var(--ink-3)}
.panel-b{padding:2px 20px 20px}

/* nota de rodapé de card (regras de cálculo, fontes de dados) */
.seg-foot{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--ink-3);padding-top:12px;margin-top:2px;border-top:1px solid var(--line)}

.empty{padding:26px;text-align:center;color:var(--ink-3);font-size:12.5px}
.load{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:13px}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--green);
  background:var(--green-soft);border-radius:20px;padding:3px 10px}

/* ═══ VISUALIZAÇÕES ═══ */
/* funil horizontal */
.fn{display:flex;flex-direction:column;gap:2px}
.fn-row{display:grid;grid-template-columns:132px 1fr 92px;gap:14px;align-items:center;padding:9px 0}
.fn-l{font-size:12.5px;color:var(--ink-2);font-weight:450}
.fn-bar{height:26px;background:var(--line-2);border-radius:7px;overflow:hidden}
.fn-fill{height:100%;border-radius:7px;background:var(--navy);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.fn-n{text-align:right;font-variant-numeric:tabular-nums}
.fn-n b{font-size:16px;font-weight:600}
.fn-n span{font-size:11px;color:var(--ink-3);display:block;margin-top:1px}

/* lista simples: rótulo + mini-barra + valor */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:none}
.row .nm{font-size:12.5px;font-weight:500}
.row .sb{font-size:11px;color:var(--ink-3);margin-top:1px}
.row .vl{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mini{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:6px;width:150px}
.mini i{display:block;height:100%;border-radius:3px;background:var(--navy)}

/* tabela enxuta */
.t2{width:100%;border-collapse:collapse;font-size:12px}
.t2 th{text-align:right;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-3);padding:6px 0 9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t2 th:first-child{text-align:left;padding-left:0}
.t2 td{text-align:right;padding:11px 0 11px 10px;border-bottom:1px solid var(--line-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.t2 td:first-child{text-align:left;padding-left:0;white-space:normal;font-weight:500;line-height:1.3}
.t2 tbody tr:last-child td{border-bottom:none}
.t2 .pc{color:var(--ink-3);font-size:10.5px;font-weight:400;margin-left:3px}
.t2 .st{font-weight:600}
.t2 .zero{color:var(--ink-3)}
.t2 tfoot td{border-top:1px solid var(--line);border-bottom:none;padding-top:12px;font-weight:600;color:var(--ink)}

/* ranking com posições */
.rk{display:flex;flex-direction:column}
.rk-i{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.rk-i:last-child{border-bottom:none}
.rk-p{width:24px;height:24px;border-radius:50%;background:var(--line-2);color:var(--ink-2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.rk-i:first-child .rk-p{background:var(--green-soft);color:var(--green)}
.rk-n{flex:1;font-size:12.5px;font-weight:500;line-height:1.3;min-width:0}
.rk-n span{display:block;font-size:11px;color:var(--ink-3);font-weight:400;margin-top:2px}
.rk-v{text-align:right;flex-shrink:0}
.rk-v b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.rk-v span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.rk-bar{height:4px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:6px}
.rk-bar i{display:block;height:100%;border-radius:3px;background:var(--navy)}

/* barra de meta (rótulo + feito/meta + barra) */
.mt-metric .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px;white-space:nowrap}
.mt-metric .lb{font-size:10.5px;color:var(--ink-3)}
.mt-metric .vl{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.mt-metric .vl em{font-style:normal;color:var(--ink-3);font-weight:400}
.mt-metric .vl i{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink-3);margin-left:5px}
.mt-metric .vl i.ok{color:var(--green);font-weight:500}
.mt-bar{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden}
.mt-bar i{display:block;height:100%;border-radius:4px;background:var(--navy);transition:width .45s cubic-bezier(.2,.7,.3,1)}

/* etapas de funil em barras horizontais com valor */
.st-row{display:grid;grid-template-columns:1.25fr 1fr 62px 96px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.st-row:last-child{border-bottom:none}
.st-row.vazio{opacity:.45}
.st-nm{font-size:12px;font-weight:500;line-height:1.3}
.st-bar{height:9px;border-radius:5px;background:var(--line-2);overflow:hidden}
.st-bar i{display:block;height:100%;border-radius:5px;background:var(--navy)}
.st-n{font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.st-v{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.st-v.zero{color:var(--ink-3)}

/* ═══ BADGES E ESTADOS ═══ */
/* dias parado / faixas de alerta */
.vd{display:inline-block;min-width:36px;text-align:center;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
.vd-ok{background:var(--line-2);color:var(--ink-2)}
.vd-y{background:#fdf6e7;color:var(--amber)}
.vd-o{background:#fdeee2;color:#c2410c}
.vd-r{background:#fdecef;color:var(--red)}

/* contagem de follow-up: zero / pouco / bom */
.fu{display:inline-block;min-width:26px;text-align:center;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;cursor:default}
.fu-zero{background:#fdecef;color:var(--red)}
.fu-baixo{background:#fdf6e7;color:var(--amber)}
.fu-ok{background:var(--green-soft);color:var(--green)}

/* ponto de temperatura/status ao lado de um nome */
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px}

/* medalha de posição (1º lugar em verde) */
.medal{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  font-size:10px;font-weight:700;margin-right:7px;background:var(--line-2);color:var(--ink-2);vertical-align:middle}
.medal.m1{background:var(--green-soft);color:var(--green)}

/* cabeçalho de seção dentro de card (ex.: faixas de alerta) */
.al-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:14px 0 4px}
.al-head:first-child{margin-top:0}
.al-head .n{font-size:12px;letter-spacing:0}

/* link discreto que revela no hover */
.deal-hs{color:inherit;text-decoration:none}
.deal-hs:hover{color:var(--navy);text-decoration:underline}

/* ═══ RESPONSIVO ═══ */
@media(max-width:1000px){.g-2,.g-21{grid-template-columns:1fr}}
@media(max-width:760px){.side{width:64px}.side-brand{justify-content:center;gap:0;padding:18px 8px}.side-brand img{width:40px}
  .side-brand .bd,.side-brand .pname,.nav-item span,.side-group .gl,.side-foot{display:none}
  .nav-item{justify-content:center}.main{margin-left:64px}.wrap{padding:18px}}

:root{color-scheme:light}
/* Protótipo: formulário em passos à esquerda, tabela de preços viva à direita. */
.passo-n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}
.nav-item{width:100%;background:none;border:0;font:inherit;text-align:left}
.nav-item.on .passo-n{border-color:#fff;color:#fff}
.nav-item.ok .passo-n{background:var(--green);border-color:var(--green);color:#fff}
.nav-item:focus-visible,.chip:focus-visible,.btn:focus-visible,.rm:focus-visible,.mini-b:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.vivo{position:sticky;top:78px}
.q{display:flex;flex-direction:column;gap:7px;padding:14px 0;border-top:1px solid var(--line-2)}
.q:first-child{border-top:0;padding-top:4px}
.q>label,.q>.rot{font-size:13px;font-weight:500;color:var(--ink)}
.q .ajuda{font-size:11.5px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;text-align:left}
.chip:hover{border-color:#cdd5e0}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip small{display:block;font-size:10.5px;font-weight:400;opacity:.8}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.campo{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%}
.campo:focus{outline:none;border-color:var(--navy)}
.lado{display:grid;grid-template-columns:1fr 90px;gap:8px}
.acoes{display:flex;gap:8px;justify-content:space-between;align-items:center;padding-top:14px;margin-top:6px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{font:inherit;font-size:12.5px;font-weight:500;padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:#cdd5e0}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.nota{font-size:12px;border-radius:9px;padding:9px 12px;background:var(--line-2);color:var(--ink-2)}
.nota.alerta{background:#fdf6e7;color:#7a4306}
.nota.bom{background:var(--green-soft);color:#00703a}
.pc-w{overflow-x:auto}
.pc{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.pc th{background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:10px 11px;text-align:left}
.pc th.v{text-align:center}
.pc td{padding:7px 11px;border-bottom:1px solid var(--line);background:#fff}
.pc td.v{text-align:center;font-weight:600;white-space:nowrap;border-left:1px solid var(--line)}
.pc td.maior{background:#f1f8f4}
.pc th.maior,.pc tfoot td.maior{background:#1f8a5b}
.pc td small{display:block;font-size:9.5px;font-weight:600;color:#7a4306}
.pc .no{color:var(--ink-3);font-weight:400}
.pc tr.sec td{background:#e8f4ee;color:#1f8a5b;font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:5px 11px}
.pc tr.sec.preco td{background:#e6ebf3;color:#334155}
.pc tfoot td{background:var(--navy);color:#fff;font-weight:700;font-size:13px;border:0;padding:10px 11px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.it{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.it td{padding:8px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
.it tr.g td{background:var(--line-2);font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-2);padding:5px 8px}
.it .r{text-align:right;white-space:nowrap}
.it .sub{font-size:10.5px;color:var(--ink-3)}
.it .para{margin-top:5px;font-size:11.5px;padding:5px 8px}
.it .para.falta{border-color:var(--amber)}
.f{display:inline-block;font-size:9.5px;font-weight:600;border-radius:9px;padding:1px 6px;margin-left:4px}
.f.barato{color:#00703a;background:var(--green-soft)}.f.medio{color:var(--ink-2);background:var(--line-2)}.f.caro{color:#b3123a;background:#fef2f4}.f.gr{color:#7a4306;background:#fdf6e7}
.qt{width:50px;font:inherit;font-size:12px;text-align:center;padding:4px;border:1px solid var(--line);border-radius:7px}
.mini-b{font:inherit;font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink-2);cursor:pointer}
.mini-b.on{background:#fdf6e7;border-color:#f3dfae;color:#7a4306}
.rm{border:0;background:none;color:var(--ink-3);cursor:pointer;float:right;font-size:13px;line-height:1}
.lista{margin:4px 0 0 16px;font-size:12.5px;line-height:1.7}
.tira{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.selo{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:#7a4306;background:#fdf6e7;border-radius:20px;padding:3px 10px;white-space:nowrap}
.linhas{display:flex;flex-direction:column;gap:10px}
pre.zap{white-space:pre-wrap;font:inherit;font-size:12px;background:var(--line-2);border-radius:9px;padding:10px 12px;max-height:240px;overflow:auto}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.vivo{position:static}}
@media(max-width:760px){.nav-item span.t{display:none}.nav-item{justify-content:center}.side-foot,.side-group .gl{display:none}.lado{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function chips(campo,ops){var atual=E[campo];return '<div class="chips">'+ops.map(function(o){var dis=o.dis?' disabled':'';return '<button type="button" class="chip" data-campo="'+campo+'" data-valor="'+esc(o.v)+'" aria-pressed="'+(String(atual)===String(o.v))+'"'+dis+'>'+esc(o.t)+(o.d?'<small>'+esc(o.d)+'</small>':'')+'</button>';}).join('')+'</div>';}

/* número com separador de milhar enquanto digita (pt-BR: 18.000); o estado guarda só os dígitos */
function milhar(d){d=String(d==null?'':d).replace(/\D/g,'');return d?Number(d).toLocaleString('pt-BR'):'';}

function mascara(el){var pos=el.selectionStart==null?el.value.length:el.selectionStart,antes=el.value.slice(0,pos).replace(/\D/g,'').length;
  var d=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,12),f=milhar(d),i=0,n=0;el.value=f;

  if(s&&E.faixa&&Number(E.faixa)!==s)h+=q('Por que trocar o tamanho sugerido?',campo('f-mot','motivo','O gerente vê esse motivo'),'','f-mot');

function p2(){var f=faixaAtual(),sug=D.horas[f],h=q('Monitoramento',chips('monitoramento',[{v:'padrao',t:'Padrão',d:'do catálogo'},{v:'customizado',t:'Customizado',d:'definido por projeto'}]));

  if(E.suporte==='local'||E.suporte==='ambos'){h+=q('Operadores de suporte local',chips('ops',['1','2','3','4','5+'].map(function(n){return {v:n,t:n==='5+'?'5 ou mais':n};})));

  h+=q('Integração com outros sistemas',chips('integ',[{v:'sim',t:'Sim'},{v:'nao',t:'Não'},{v:'nao_sei',t:'Ainda não sei'}]));return h;}
function p3(){var n=E.plano,its=plano(n),t=totais(its),k=cabe(n),h='<div class="linhas"><div class="tabs">'+NIVEIS.map(function(x){return '<button type="button" class="chip" data-plano="'+x+'" aria-pressed="'+(x===n)+'">'+esc(NOME[x])+'</button>';}).join('')+'</div>';
  h+=q('Preço estimado do '+NOME[n]+' (opcional)',numero('f-est','preco','Ex.: 190.000',E.preco[n]||''),'Em reais, quanto o cliente pode pagar em 12 meses.','f-est');
  if(k&&k.cabe)h+='<div class="nota bom">Cabe no preço estimado. Sobram '+brl(k.folga)+'.'+(t.semPreco?' '+t.semPreco+' item(ns) sem preço ficaram fora da conta.':'')+'</div>';
  else if(k){h+='<div class="nota alerta">Passa '+brl(k.falta)+' do preço estimado. '+(k.tirar.length?(k.resolve?'Para caber, dá para tirar:':'Mesmo tirando o que é opcional não cabe. O que mais pesa:'):'Só restam os itens básicos; revise as quantidades.');
    k.tirar.forEach(function(x){h+='<div class="tira"><span>'+esc(D.grupos[x.g])+': '+brl(x.v)+' em 12 meses</span><button type="button" class="mini-b" data-tira="'+x.g+'">Tirar</button></div>';});h+='</div>';}
  h+='<div style="overflow-x:auto"><table class="it"><tbody>';var gs=[];its.forEach(function(i){if(gs.indexOf(i.grupo)<0)gs.push(i.grupo);});

    its.forEach(function(i){if(i.grupo!==g)return;var ky=chave(n,i.id),falta=i.qtd>1&&!i.para.trim();
      h+='<tr><td>'+esc(i.nome)+faixaPreco(i)+(i.gratis?'<span class="f gr">grátis</span>':'')+'<div class="sub">'+esc(i.unidade)+(i.unit==null?' · sem preço':' · '+brl(i.unit))+'</div>'+
        (i.qtd>1||i.para?'<input class="campo para'+(falta?' falta':'')+'" aria-label="Para quê" data-para="'+esc(ky)+'" value="'+esc(i.para)+'" placeholder="Para quê? Ex.: 1 para o jurídico, 1 para o fiscal">':'')+'</td>'+
        '<td class="r"><input class="qt" type="number" min="0" max="999" aria-label="Quantidade" data-qtd="'+esc(ky)+'" value="'+i.qtd+'"></td>'+
        '<td class="r">'+(i.unit==null?'—':i.gratis?'<s>'+brl(i.unit*i.qtd)+'</s>':brl(i.unit*i.qtd))+'<div style="margin-top:4px"><button type="button" class="mini-b'+(i.gratis?' on':'')+'" data-gr="'+esc(ky)+'" title="O gerente aprova o que vai grátis">Grátis</button></div></td></tr>';});});
  h+='</tbody></table></div>';
  var quais=Object.keys(D.grupos).filter(function(g){return gs.indexOf(g)<0&&g!=='subcanal'&&g!=='canal';});
  if(quais.length)h+='<div class="tabs" style="align-items:center"><span class="ajuda" style="font-size:11.5px;color:var(--ink-3)">Acrescentar:</span>'+quais.map(function(g){return '<button type="button" class="mini-b" data-poe="'+g+'">+ '+esc(D.grupos[g])+'</button>';}).join('')+'</div>';
  return h+'</div>';}
function textoZap(){var f=faltas(),l=['*Resumo do negócio — '+(E.cliente||'Cliente não informado')+'*',[nomeSol(),E.cidade&&(E.cidade+(E.uf?' - '+E.uf:'')),'canal para '+D.faixas[faixaAtual()]].filter(Boolean).join(' · '),'','*Planos*'];

  h+='<div><div class="rot" style="font-size:13px;font-weight:500;margin-bottom:6px">Texto para o WhatsApp</div><pre class="zap" id="zap">'+esc(textoZap())+'</pre><div class="tabs" style="margin-top:8px"><button type="button" class="btn" id="bt-copia">Copiar texto</button><button type="button" class="btn pri" id="bt-envia">Aprovar e enviar ao gerente</button></div></div>';
  if(E.enviado)h+='<div class="nota bom">No sistema, aqui a proposta em PDF seria gerada e o gerente seria avisado. Como é um protótipo, nada foi enviado.</div>';

var RENDER=[p0,p1,p2,p3,p4];
function passoOk(i){return i===0?!!(E.cliente.trim()&&E.solucao&&E.setor):i===1?!!E.publico:i===2?!!(E.suporte&&E.integ):false;}
function $(i){return document.getElementById(i);}

  $('corpo').innerHTML=RENDER[E.passo]()+'<div class="acoes"><button type="button" class="btn" data-ir="'+(E.passo-1)+'"'+(E.passo===0?' disabled style="visibility:hidden"':'')+'>Voltar</button>'+(E.passo<PASSOS.length-1?'<button type="button" class="btn pri" data-ir="'+(E.passo+1)+'">Continuar</button>':'')+'</div>';
  $('tit').textContent=E.cliente.trim()||'Nova proposta';nav();vivo();guarda();}
/* só atualiza o que depende do texto digitado, para não perder o foco */
function parcial(){$('tit').textContent=E.cliente.trim()||'Nova proposta';nav();vivo();guarda();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;var d=b.dataset;
  if(d.campo){var v=d.valor;E[d.campo]=(String(E[d.campo])===v)?null:(d.campo==='faixa'||d.campo==='horas'?Number(v):v);

    if(d.campo==='solucao'&&E.solucao==='Cidade na mão'&&E.publico==='interno')E.publico=null;desenha();return;}
  if(d.passo!=null){E.passo=+d.passo;desenha();window.scrollTo(0,0);return;}
  if(d.ir!=null){E.passo=+d.ir;desenha();window.scrollTo(0,0);return;}
  if(d.plano){E.plano=d.plano;desenha();return;}
  if(d.ex!=null){var x=EX[+d.ex];E.cliente=x.c;E.solucao=x.s;E.cidade=x.cid;E.uf=x.u;E.pop=String(x.p);E.setor='publico';desenha();return;}

  if(d.gr){E.gratis[d.gr]=!E.gratis[d.gr];desenha();return;}
  if(b.id==='bt-envia'){E.enviado=true;desenha();return;}
  if(b.id==='bt-copia'){var t=textoZap();var ok=function(){b.textContent='Texto copiado';};var alt=function(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(z){b.textContent='Selecione o texto acima e copie';}a.remove();};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,alt);else alt();return;}
  if(b.id==='bt-limpa'){E=novo();desenha();window.scrollTo(0,0);return;}
  if(b.id==='bt-ex'){E=novo();Object.assign(E,{existe:'sim',cliente:'Prefeitura de Alvorada (exemplo)',solucao:'Cidade na mão',setor:'publico',cidade:'Alvorada',uf:'AM',pop:'18000',modalidade:'dispensa',publico:'populacao',faixa:5000,suporte:'ambos',horas:6,ops:'2',distr:'unidade',integ:'nao',passo:3,plano:'premium',preco:{premium:'190000'}});desenha();window.scrollTo(0,0);return;}
});
document.addEventListener('input',function(e){var el=e.target,d=el.dataset;E.enviado=false;
  if(d.num){var dig=mascara(el);if(d.num==='preco'){E.preco[E.plano]=dig;}else E[d.num]=dig;parcial();return;}

document.addEventListener('change',function(e){var el=e.target,d=el.dataset;

  if(d.para!=null){E.para[d.para]=el.value;desenha();return;}
});
